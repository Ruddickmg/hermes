version: 2.1

orbs:
  windows: circleci/windows@5.0
  rust: circleci/rust@1.8.0

  node: circleci/node@7.1.0

#-----------------------------------------------------------------------------------------------------------------------------

executors:
  node:
    docker:
      - image: node:22.16.0
  mac-aarch64:
    resource_class: macos.m1.medium.gen1 
    macos:
      xcode: 26.3.0
  rust-linux-x86_64:
    docker:
      - image: cimg/rust:1.93.1
    resource_class: large
    environment:
      PIPELINE_NUM: << pipeline.number >>
      TZ: "America/Los_Angeles"
  rust-linux-aarch64:
    docker:
      - image: cimg/rust:1.93.1
    resource_class: arm.medium
    environment:
      PIPELINE_NUM: << pipeline.number >>
      TZ: "America/Los_Angeles"
  ubuntu:
    resource_class: large
    environment:
      PIPELINE_NUM: << pipeline.number >>
      TZ: "America/Los_Angeles"
    machine:
      image: ubuntu-2204:2025.09.1
      docker_layer_caching: true

#-----------------------------------------------------------------------------------------------------------------------------

workflows:
  ci_cd:
    jobs:
      - check_formatting
      - lua_tests_0_12:
          requires:
            - fetch-registry
      - lua_tests_0_11:
          requires:
            - fetch-registry
      - check_license:
          requires:
            - fetch-registry
      - fetch-registry
      - integration_tests:
          requires:
            - fetch-registry
      - unit_tests:
          requires:
            - fetch-registry
      - e2e_tests_0_12:
          requires:
            - fetch-registry
      - e2e_tests_0_11:
          requires:
            - fetch-registry
      - update-cargo-version:
          filters:
            branches:
              only: 
                - main
                - development
      - build-linux-x86_64:
          filters:
            branches:
              only:
                - main
                - development
          requires:
            - update-cargo-version
            - fetch-registry
      - build-linux-aarch64:
          filters:
            branches:
              only:
                - main
                - development
          requires:
            - update-cargo-version
            - fetch-registry
      - build-mac-aarch64:
          filters:
            branches:
              only:
                - main
                - development
          requires:
            - update-cargo-version
            - fetch-registry
      - build-mac-x86_64:
          filters:
            branches:
              only:
                - main
                - development
          requires:
            - update-cargo-version
            - fetch-registry
      - build-windows-x86_64:
          filters:
            branches:
              only:
                - main
                - development
          requires:
            - update-cargo-version
            - fetch-registry

      - release:
          filters:
            branches:
              only: 
                - main
                - development
          requires:
            - check_formatting
            - lua_tests_0_12
            - lua_tests_0_11
            - check_license
            - integration_tests
            - unit_tests
            - e2e_tests_0_12
            - e2e_tests_0_11
            - build-linux-x86_64
            - build-linux-aarch64
            - build-mac-aarch64
            - build-mac-x86_64
            - build-windows-x86_64

      - publish-luarocks:
          filters:
            branches:
              only:
                - main
          requires:
            - release

#-----------------------------------------------------------------------------------------------------------------------------

commands:
  upload-coverage:
    description: Upload a coverage report to Codecov using the CLI
    parameters:
      file:
        type: string
        description: Path to the coverage report file
      allow-failure:
        type: boolean
        default: false
        description: Whether to allow the upload to fail without failing the job
    steps:
      - run:
          name: Upload coverage to Codecov
          command: |
            curl -Os https://cli.codecov.io/latest/linux/codecov
            chmod +x codecov
            if [ "<< parameters.allow-failure >>" = "true" ]; then
              ./codecov upload-coverage --file << parameters.file >> --disable-search || true
            else
              ./codecov upload-coverage --file << parameters.file >> --disable-search
            fi

  restore-cargo-cache:
    steps:
      - restore_cache:
          keys:
            - v1-cargo-{{ arch }}-{{ checksum "Cargo.lock" }}
            - v1-cargo-{{ arch }}-

  save-cargo-cache:
    steps:
      - save_cache:
          key: v1-cargo-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry/index
            - ~/.cargo/registry/cache
            - ~/.cargo/git/db
            - ~/.cargo/bin
            - ~/.cargo/.crates.toml
            - ~/.cargo/.crates2.json

jobs:
  update-cargo-version:
    executor: node
    steps:
      - checkout
      - rust/install
      - run:
          name: Install cargo edit
          command: cargo install cargo-edit
      - run:
          name: Install pnpm package manager
          command: npm install -g pnpm
      - run:
          name: Install
          command: pnpm install --frozen-lockfile
      - run:
          name: Update Cargo.toml version
          command: |
            node .circleci/get-next-version.mjs > version.txt
            NEXT_VERSION=$(tail -n1 version.txt)
            if [ -n "$NEXT_VERSION" ]; then
              echo "Next version: $NEXT_VERSION"
              cargo set-version "$NEXT_VERSION"
              echo "Updated Cargo.toml with version $NEXT_VERSION"
            fi
      - persist_to_workspace:
          root: .
          paths:
            - version.txt
            - Cargo.toml
            - Cargo.lock

  release:
    executor: node
    environment:
      CIRCLE_PR_NUMBER: ""
      CIRCLE_PULL_REQUEST: ""
      CI_PULL_REQUEST: ""
    steps:
      - checkout
      - run:
          name: Install pnpm package manager
          command: npm install -g pnpm
      - run:
          name: Install
          command: pnpm install --frozen-lockfile
      - attach_workspace:
          at: target/release
      - run:
          name: Semantic release
          command: pnpm release

  publish-luarocks:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: target/release
      - run:
          name: Publish to LuaRocks
          command: |
            set -e

            VERSION=$(cat target/release/version.txt)
            if [ -z "$VERSION" ]; then
              echo "No version to publish"
              exit 0
            fi

            # --- Install LuaRocks and dependencies ---
            apt-get update
            apt-get install -y lua5.1 liblua5.1-dev wget zip unzip jq
            wget -q https://luarocks.org/releases/luarocks-3.9.2.tar.gz
            tar zxf luarocks-3.9.2.tar.gz
            cd luarocks-3.9.2 && ./configure && make && make install
            cd ..
            # dkjson is required by `luarocks upload` to parse the server response
            luarocks install dkjson

            # --- Publish source rockspec ---
            # The CLI `luarocks upload` packs and uploads a `.src.rock` automatically
            # alongside the rockspec. luarocks.org accepts these via its standard
            # upload endpoint.
            SED_EXPR="s/scm-1/${VERSION}-1/g; /branch = \"main\"/d; s|git+https://github.com/Ruddickmg/hermes.nvim.git|https://github.com/Ruddickmg/hermes.nvim/archive/refs/tags/v${VERSION}.tar.gz|"
            SOURCE_ROCKSPEC="/tmp/hermes.nvim-${VERSION}-1.rockspec"
            sed "$SED_EXPR" hermes.nvim-scm-1.rockspec > "$SOURCE_ROCKSPEC"
            # The GitHub-generated archive extracts into "hermes.nvim-${VERSION}" (no "v"),
            # so we must tell LuaRocks the expected source directory.
            sed -i "/url = \"https:.*archive.*tar\.gz\"/a\\  dir = \"hermes.nvim-${VERSION}\"," "$SOURCE_ROCKSPEC"
            luarocks upload "$SOURCE_ROCKSPEC" --api-key="${LUAROCKS_API_KEY}"
            echo "Source rock published: hermes.nvim-${VERSION}-1"

            # --- Look up the version_id needed for binary rock uploads ---
            # luarocks.org's REST API requires the numeric version id; we fetch it via
            # the check_rockspec endpoint after the source upload registered the version.
            CHECK_RESPONSE=$(curl -fsSL "https://luarocks.org/api/1/${LUAROCKS_API_KEY}/check_rockspec?package=hermes.nvim&version=${VERSION}-1")
            VERSION_ID=$(echo "$CHECK_RESPONSE" | jq -r '.version.id // empty')
            if [ -z "$VERSION_ID" ]; then
              echo "Failed to obtain version_id from API"
              echo "Response: $CHECK_RESPONSE"
              exit 1
            fi
            echo "Version ID: $VERSION_ID"

            # --- Publish one binary rock per platform ---
            # We construct a minimal per-platform rockspec that declares the prebuilt
            # binary via `build.install.lib`, run `luarocks make --pack-binary-rock`
            # to produce a properly formatted `.rock` (ZIP with rock_manifest), then
            # rename the file to the target platform and POST it to the LuaRocks API.
            # The platform string in the filename is the only thing the server uses
            # to record the rock's arch; the ZIP contents are platform-agnostic from
            # LuaRocks' perspective.
            for binary in target/release/libhermes-*.so target/release/libhermes-*.dylib target/release/libhermes-*.dll; do
              [ -f "$binary" ] || continue

              BINARY_NAME=$(basename "$binary")
              OUR_PLATFORM=$(echo "$BINARY_NAME" | sed 's/^libhermes-//; s/\.\(so\|dylib\|dll\)$//')

              case "$OUR_PLATFORM" in
                linux-x86_64)   LR_PLATFORM="linux-x86_64" ;;
                linux-aarch64)  LR_PLATFORM="linux-aarch64" ;;
                macos-aarch64)  LR_PLATFORM="macosx-arm64" ;;
                macos-x86_64)   LR_PLATFORM="macosx-x86_64" ;;
                windows-x86_64) LR_PLATFORM="win32-x86_64" ;;
                *)
                  echo "Skipping unknown platform: $OUR_PLATFORM"
                  continue
                  ;;
              esac

              ROCK_DIR=$(mktemp -d)
              mkdir -p "$ROCK_DIR/lib"
              cp "$binary" "$ROCK_DIR/lib/$BINARY_NAME"

              # Generate per-platform binary rockspec. `build.install.lib` is what
              # tells `luarocks make` to include the binary in the rock's lib/ dir.
              # The key ("hermes_native") is the install module name and is
              # irrelevant: hermes.binary loads the file directly via package.loadlib
              # using the filename, which is preserved verbatim.
              cat > "$ROCK_DIR/hermes.nvim-${VERSION}-1.rockspec" <<ROCKSPEC
            rockspec_format = "3.0"
            package = "hermes.nvim"
            version = "${VERSION}-1"
            source = {
              url = "https://github.com/Ruddickmg/hermes.nvim/archive/refs/tags/v${VERSION}.tar.gz",
              dir = "hermes.nvim-${VERSION}"
            }
            description = {
              summary = "ACP (Agent Client Protocol) client for Neovim",
              detailed = [[
                Hermes is an interface between Neovim and ACP (Agent Client Protocol),
                enabling AI assistant integration directly within Neovim.
              ]],
              homepage = "https://github.com/Ruddickmg/hermes.nvim",
              license = "MIT",
              maintainer = "Ruddickmg"
            }
            dependencies = {
              "lua >= 5.1"
            }
            build = {
              type = "builtin",
              modules = {
                ["hermes"] = "lua/hermes/init.lua",
                ["hermes.binary"] = "lua/hermes/binary.lua",
                ["hermes.config"] = "lua/hermes/config.lua",
                ["hermes.download"] = "lua/hermes/download.lua",
                ["hermes.health"] = "lua/hermes/health.lua",
                ["hermes.logging"] = "lua/hermes/logging.lua",
                ["hermes.platform"] = "lua/hermes/platform.lua",
                ["hermes.queue"] = "lua/hermes/queue.lua",
                ["hermes.version"] = "lua/hermes/version.lua"
              },
              install = {
                lib = {
                  ["hermes_native"] = "lib/${BINARY_NAME}"
                }
              },
              copy_directories = {
                "plugin",
                "doc"
              }
            }
            ROCKSPEC

              # Stage the rest of the source tree so `luarocks make` can find it
              mkdir -p "$ROCK_DIR/lua/hermes" "$ROCK_DIR/plugin" "$ROCK_DIR/doc"
              cp lua/hermes/*.lua "$ROCK_DIR/lua/hermes/"
              cp plugin/hermes.lua "$ROCK_DIR/plugin/"
              cp doc/hermes.txt "$ROCK_DIR/doc/"

              # Build the rock. The runner is Linux x86_64 so the output filename
              # is always `*.linux-x86_64.rock` regardless of the target platform.
              (
                cd "$ROCK_DIR"
                luarocks make --pack-binary-rock "hermes.nvim-${VERSION}-1.rockspec"
              )

              # The build runner is Linux x86_64; skip the rename when the target
              # platform is the same, otherwise `mv` errors on identical paths.
              ROCK_FILE="$ROCK_DIR/hermes.nvim-${VERSION}-1.${LR_PLATFORM}.rock"
              if [ "$LR_PLATFORM" != "linux-x86_64" ]; then
                mv "$ROCK_DIR/hermes.nvim-${VERSION}-1.linux-x86_64.rock" "$ROCK_FILE"
              fi

              # Upload the binary rock via the LuaRocks REST API and report any
              # non-2xx response body for diagnostics.
              UPLOAD_BODY=$(mktemp)
              HTTP_CODE=$(curl -sS -o "$UPLOAD_BODY" -w "%{http_code}" -X POST \
                "https://luarocks.org/api/1/${LUAROCKS_API_KEY}/upload_rock/${VERSION_ID}" \
                -F "rock_file=@${ROCK_FILE}")
              if [ "$HTTP_CODE" != "200" ]; then
                echo "Binary rock upload failed for ${LR_PLATFORM} (HTTP ${HTTP_CODE}):"
                cat "$UPLOAD_BODY"
                rm -f "$UPLOAD_BODY"
                rm -rf "$ROCK_DIR"
                exit 1
              fi
              rm -f "$UPLOAD_BODY"

              echo "Binary rock published: hermes.nvim-${VERSION}-1.${LR_PLATFORM}.rock"
              rm -rf "$ROCK_DIR"
            done

  check_license:
    executor: rust-linux-x86_64
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore-cargo-cache
      - run:
          name: Install cargo-deny
          command: command -v cargo-deny &> /dev/null || cargo install --locked cargo-deny
      - run:
          name: Check for license
          command: cargo deny check licenses

  fetch-registry:
    executor: rust-linux-x86_64
    steps:
      - checkout
      - restore-cargo-cache
      - run:
          name: Download ACP Agent Registry
          command: |
            mkdir -p src/acp/registry
            curl -fsSL https://cdn.agentclientprotocol.com/registry/v1/latest/registry.json \
              -o src/acp/registry/registry.json
      - run:
          name: Fetch Cargo dependencies
          command: cargo fetch
      - save-cargo-cache
      - persist_to_workspace:
          root: .
          paths:
            - src/acp/registry/registry.json

  build-linux-x86_64:
    executor: rust-linux-x86_64
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore-cargo-cache
      - run:
          name: Build for x86_64
          command: cargo build --release --features with-icons
      - run:
          name: Rename binary
          command: mv target/release/libhermes.so target/release/libhermes-linux-x86_64.so
      - persist_to_workspace:
          root: target/release
          paths:
            - libhermes-linux-x86_64.so

  build-linux-aarch64:
    executor: rust-linux-aarch64
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore-cargo-cache
      - run:
          name: Build for aarch64
          command: cargo build --release --features with-icons
      - save-cargo-cache
      - run:
          name: Rename binary
          command: mv target/release/libhermes.so target/release/libhermes-linux-aarch64.so
      - persist_to_workspace:
          root: target/release
          paths:
            - libhermes-linux-aarch64.so

  build-mac-aarch64:
    executor: mac-aarch64
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install Rust
          command: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - run:
          name: Build for aarch64
          command: cargo build --release --features with-icons
      - run:
          name: Rename binary
          command: mv target/release/libhermes.dylib target/release/libhermes-macos-aarch64.dylib
      - persist_to_workspace:
          root: target/release
          paths:
            - libhermes-macos-aarch64.dylib

  build-mac-x86_64:
    executor: mac-aarch64
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install Rosetta 2
          command: softwareupdate --install-rosetta --agree-to-license
      - run:
          name: Install Rust
          command: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - run:
          name: Install x86_64 target
          command: rustup target add x86_64-apple-darwin
      - run:
          name: Build for x86_64 (cross-compile)
          command: cargo build --release --features with-icons --target x86_64-apple-darwin
      - run:
          name: Rename binary
          command: mv target/release/libhermes.dylib target/release/libhermes-macos-x86_64.dylib 2>/dev/null || mv target/x86_64-apple-darwin/release/libhermes.dylib target/release/libhermes-macos-x86_64.dylib
      - persist_to_workspace:
          root: target/release
          paths:
            - libhermes-macos-x86_64.dylib
  
  build-windows-x86_64:
    executor: windows/default
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install Rust (MSVC)
          command: |
            choco install rustup.install -y
            refreshenv
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            rustup --version
            rustup toolchain install stable-x86_64-pc-windows-msvc
            rustup default stable-x86_64-pc-windows-msvc
            rustup target add x86_64-pc-windows-msvc
            rustc -vV
      - run:
          name: Build for Windows x86_64
          command: |
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            cargo build --release --features with-icons --target x86_64-pc-windows-msvc
      - run:
          name: Rename DLL
          command: |
            $dllPath = "target/x86_64-pc-windows-msvc/release/hermes.dll"
            if (Test-Path $dllPath) {
                Move-Item $dllPath "target/x86_64-pc-windows-msvc/release/libhermes-windows-x86_64.dll"
            } else {
                Write-Error "DLL not found at expected path"
                exit 1
            }
      - persist_to_workspace:
          root: target/x86_64-pc-windows-msvc/release
          paths:
            - libhermes-windows-x86_64.dll

  check_formatting:
    executor: rust-linux-x86_64
    steps:
      - checkout
      - restore-cargo-cache
      - run:
          name: Check Rust formatting
          command: cargo fmt -- --check
      - run:
          name: Install Lua tooling
          command: |
            # Install selene for Lua linting
            command -v selene &> /dev/null || cargo install selene --locked
      - run:
          name: Lint Lua code
          command: |
            selene --config selene.toml lua/ tests/lua/spec/

  unit_tests:
    environment:
      CARGO_TARGET_DIR: target
    executor: ubuntu
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore-cargo-cache
      - rust/install
      - run:
          name: Install coverage tool
          command: |
            cargo install cargo-llvm-cov@0.6.13
            cargo install cargo-nextest --locked
      - run:
          name: Run unit tests
          command: cargo llvm-cov nextest --package hermes --bins --lib --all-features --lcov --output-path unit.coverage.info --ignore-filename-regex 'tests/.*'
      - upload-coverage:
          file: unit.coverage.info

  integration_tests:
    environment:
      CARGO_TARGET_DIR: target
      NEOVIM_VERSION: 0.12.2
      TERM: xterm-256color
      LANG: en_US.UTF-8
    executor: ubuntu
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore-cargo-cache
      - rust/install
      - run:
          name: Install Neovim from tarball
          command: |
            curl -LO https://github.com/neovim/neovim/releases/download/v${NEOVIM_VERSION}/nvim-linux-x86_64.tar.gz
            tar xzf nvim-linux-x86_64.tar.gz
            sudo mv nvim-linux-x86_64 /opt/nvim
            sudo ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim
            nvim --version
      - run:
          name: Install coverage tools
          command: |
            cargo install cargo-llvm-cov@0.6.13
            cargo install cargo-nextest --locked
      - run:
          name: Run integration tests
          command: |
            eval "$(cargo llvm-cov show-env --export-prefix)"
            cargo llvm-cov clean --workspace
            cargo build --all-features --package hermes-integration
            cargo nextest run --package hermes-integration --all-features
            cargo llvm-cov report --lcov --output-path integration.coverage.info --ignore-filename-regex 'tests/.*'
      - upload-coverage:
          file: integration.coverage.info

  e2e_tests_0_12:
    environment:
      CARGO_TARGET_DIR: target
      NEOVIM_VERSION: 0.12.2
      TERM: xterm-256color
      LANG: en_US.UTF-8
    executor: ubuntu
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore-cargo-cache
      - rust/install
      - run:
          name: Install Neovim from tarball
          command: |
            curl -LO https://github.com/neovim/neovim/releases/download/v${NEOVIM_VERSION}/nvim-linux-x86_64.tar.gz
            tar xzf nvim-linux-x86_64.tar.gz
            sudo mv nvim-linux-x86_64 /opt/nvim
            sudo ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim
            nvim --version
      - run:
          name: Install coverage tools
          command: |
            cargo install cargo-llvm-cov@0.6.13
            cargo install cargo-nextest --locked
      - run:
          name: Install Opencode
          command: curl -fsSL https://opencode.ai/install | bash
      - run:
          name: Install GitHub Copilot
          command: curl -fsSL https://gh.io/copilot-install | bash
      - run:
          name: Run e2e tests (0.12)
          command: |
            export PATH="/home/circleci/.local/bin:$PATH"
            eval "$(cargo llvm-cov show-env --export-prefix)"
            cargo llvm-cov clean --workspace
            cargo nextest run --package hermes-e2e --all-features --no-capture
            cargo llvm-cov report --lcov --output-path e2e.coverage.info --ignore-filename-regex 'tests/.*'
      - upload-coverage:
          file: e2e.coverage.info

  e2e_tests_0_11:
    environment:
      CARGO_TARGET_DIR: target
      NEOVIM_VERSION: 0.11.6
      TERM: xterm-256color
      LANG: en_US.UTF-8
    executor: ubuntu
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore-cargo-cache
      - rust/install
      - run:
          name: Install Neovim from tarball
          command: |
            curl -LO https://github.com/neovim/neovim/releases/download/v${NEOVIM_VERSION}/nvim-linux-x86_64.tar.gz
            tar xzf nvim-linux-x86_64.tar.gz
            sudo mv nvim-linux-x86_64 /opt/nvim
            sudo ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim
            nvim --version
      - run:
          name: Install cargo-nextest
          command: cargo install cargo-nextest --locked
      - run:
          name: Install Opencode
          command: curl -fsSL https://opencode.ai/install | bash
      - run:
          name: Install GitHub Copilot
          command: curl -fsSL https://gh.io/copilot-install | bash
      - run:
          name: Run e2e tests (0.11)
          command: |
            export PATH="/home/circleci/.local/bin:$PATH"
            cargo nextest run --package hermes-e2e --all-features --no-capture

  lua_tests_0_12:
    environment:
      NEOVIM_VERSION: 0.12.2
      TERM: xterm-256color
      LANG: en_US.UTF-8
    executor: ubuntu
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore-cargo-cache
      - rust/install
      - run:
          name: Install Neovim from tarball
          command: |
            curl -LO https://github.com/neovim/neovim/releases/download/v${NEOVIM_VERSION}/nvim-linux-x86_64.tar.gz
            tar xzf nvim-linux-x86_64.tar.gz
            sudo mv nvim-linux-x86_64 /opt/nvim
            sudo ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim
