# [package.metadata]
# test-threads = 1

[package]
name = "hermes-e2e"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
agent-client-protocol = { version = "0.12", features = [
  "unstable_message_id",
  "unstable_session_fork",
  "unstable_session_model",
  "unstable_session_usage"
] }
async-channel = "2"
async-io = "2"
async-net = "2"
async-trait = "0.1"
futures = "0.3"
futures-lite = "2"
hermes = { path = "../.." }
mlua = { version = "0.10", features = ["module"] }
nvim-oxi = { version = "0.6.0", features = ["neovim-0-11", "test", "mlua"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
tracing = "0.1.44"
pretty_assertions = "1.4"
tempfile = "3.14"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
nvim-oxi = { version = "0.6.0", features = ["test", "neovim-0-11"] }

# [profile.test]
# opt-level = 0
