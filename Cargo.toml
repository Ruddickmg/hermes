
[package]
name = "hermes"
version = "0.0.0-development"
edition = "2024"

[package.metadata.precommit]
fmt = "cargo fmt && { git diff --cached --name-only --diff-filter=ACM | while IFS= read -r f; do git add \"$f\"; done; true; }"

[workspace]
members = [".", "tests/e2e", "tests/integration"]
resolver = "2"

[workspace.metadata.precommit]
fmt = "cargo fmt && { git diff --cached --name-only --diff-filter=ACM | while IFS= read -r f; do git add \"$f\"; done; true; }"

# Pull `nvim-oxi` from the ide-outils fork (PR #307 against upstream) until
# upstream merges Neovim 0.12 support. The fork has been locally patched in
# .cargo/git/checkouts/ to add a `buf` spacer field after `buffer` in
# CreateAutocmdOpts, ExecAutocmdsOpts, and ClearAutocmdsOpts.
# Neovim 0.12.2 added `buf` to these keyset structs, shifting all
# hashy-derived mask-bit positions by one. The fix:
# - Keep `buffer` field always (for the `.buffer()` builder setter)
# - Add `buf` field (gated on `neovim-0-12`, `#[builder(skip)]`) as a
#   position-holder so subsequent fields keep correct mask-bit indices
# Without this every autocmd call fails with `Required: 'command' or 'callback'`.
#
# Tracked upstream as https://github.com/noib3/nvim-oxi/pull/307.
# Drop this `[patch]` block and switch back to `crates-io` once upstream merges.
[patch.crates-io]
nvim-oxi       = { git = "https://github.com/ide-outils/nvim-oxi", rev = "13bec91cdbbaae10b5313621054ac9a8dd118964" }
nvim-oxi-api   = { git = "https://github.com/ide-outils/nvim-oxi", rev = "13bec91cdbbaae10b5313621054ac9a8dd118964" }
nvim-oxi-macros = { git = "https://github.com/ide-outils/nvim-oxi", rev = "13bec91cdbbaae10b5313621054ac9a8dd118964" }
nvim-oxi-types = { git = "https://github.com/ide-outils/nvim-oxi", rev = "13bec91cdbbaae10b5313621054ac9a8dd118964" }
nvim-oxi-luajit = { git = "https://github.com/ide-outils/nvim-oxi", rev = "13bec91cdbbaae10b5313621054ac9a8dd118964" }
nvim-oxi-libuv = { git = "https://github.com/ide-outils/nvim-oxi", rev = "13bec91cdbbaae10b5313621054ac9a8dd118964" }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agent-client-protocol = { version = "0.12", features = [
    "unstable_message_id",
    "unstable_session_fork",
    "unstable_session_model",
    "unstable_session_usage",
    "unstable_session_additional_directories",
    "unstable_session_delete",
    "unstable_mcp_over_acp",
    "unstable_auth_methods",
    # "unstable_boolean_config",
    # "unstable_llm_providers",
    # "unstable_nes",
    "unstable_logout",
] }
async-channel = "2"
async-io = "2"
async-lock = "3"
async-net = "2"
async-process = "2"
async-trait = "0.1"
blocking = "1"
crossbeam-channel = "0.5.15"
event-listener = "5"
futures = "0.3"
futures-lite = "2"
mlua = { version = "0.11", features = ["module"] }
nvim-oxi = { version = "0.6.0", features = ["libuv", "mlua", "neovim-0-12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2"
strip-ansi-escapes = "0.2"
tar = "0.4"
tracing = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
tracing-subscriber = { version = "0.3.0", features = ["json", "env-filter"] }
uuid = { version = "1.22.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
nvim-oxi = { version = "0.6.0", features = ["test", "neovim-0-12"] }
# panic = "abort" removed - errors are logged and Ok returned instead

[dev-dependencies]
cargo-sort = "2.1.4"
pre-commit-hooks = "0.3.0"
pretty_assertions = "1.4"
proptest = "1.10.0"
tempfile = "3.14"

[profile.release]

