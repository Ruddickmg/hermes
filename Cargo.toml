
[package]
name = "hermes"
version = "0.0.0-development"
edition = "2024"

[package.metadata.precommit]
fmt = "cargo fmt && { git diff --cached --name-only --diff-filter=ACM | while IFS= read -r f; do git add \"$f\"; done; true; }"

[workspace]
members = [".", "tests/e2e", "tests/integration"]
resolver = "2"

[workspace.metadata.precommit]
fmt = "cargo fmt && { git diff --cached --name-only --diff-filter=ACM | while IFS= read -r f; do git add \"$f\"; done; true; }"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agent-client-protocol = { version = "0.12", features = [
    "unstable_message_id",
    "unstable_session_fork",
    "unstable_session_model",
    "unstable_session_usage",
    "unstable_session_additional_directories",
    "unstable_session_delete",
    "unstable_mcp_over_acp",
    "unstable_auth_methods",
    # "unstable_boolean_config",
    # "unstable_llm_providers",
    # "unstable_nes",
    "unstable_logout",
] }
async-channel = "2"
async-io = "2"
async-lock = "3"
async-net = "2"
async-process = "2"
async-trait = "0.1"
blocking = "1"
crossbeam-channel = "0.5.15"
event-listener = "5"
futures = "0.3"
futures-lite = "2"
mlua = { version = "0.10", features = ["module"] }
nvim-oxi = { version = "0.6.0", features = ["libuv", "mlua", "neovim-0-11"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2"
strip-ansi-escapes = "0.2"
tracing = "0.1"
ureq = { version = "2", default-features = false, features = ["tls"] }
tracing-subscriber = { version = "0.3.0", features = ["json", "env-filter"] }
uuid = { version = "1.22.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
nvim-oxi = { version = "0.6.0", features = ["test", "neovim-0-11"] }
# panic = "abort" removed - errors are logged and Ok returned instead

[dev-dependencies]
cargo-sort = "2.1.4"
criterion = "0.8.2"
env_logger = "0.11"

mockall  = "0.14.0"
pre-commit-hooks = "0.3.0"
pretty_assertions = "1.4"
proptest = "1.10.0"
tempfile = "3.14"

[profile.release]

